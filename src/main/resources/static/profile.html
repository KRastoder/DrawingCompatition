<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile | Drawing Competition</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header id="app-header" class="app-header"></header>

<main class="page narrow">
    <section class="panel profile-card">
        <div class="page-head">
            <div>
                <h2 id="profile-heading">Your profile</h2>
                <p id="profile-subtitle" class="tagline">Upload a picture and tell people about your art.</p>
            </div>
            <a class="btn btn-small btn-ghost" href="/">Back to gallery</a>
        </div>

        <div class="profile-head">
            <div id="profile-avatar" class="profile-avatar"></div>
            <div class="profile-identity">
                <h3 id="profile-display-name"></h3>
                <p id="profile-username" class="tagline"></p>
            </div>
            <div id="profile-actions" class="profile-actions hidden">
                <button type="button" class="btn btn-small" id="upload-avatar-button">Upload picture</button>
                <button type="button" class="btn btn-small btn-danger" id="remove-avatar-button">Remove picture</button>
                <input type="file" id="avatar-input" accept="image/png,image/jpeg,image/webp" hidden>
            </div>
        </div>

        <div id="profile-edit" class="hidden">
            <div class="field">
                <label for="profile-bio">Description</label>
                <textarea id="profile-bio" maxlength="500" rows="5"
                          placeholder="Tell people about yourself and your art"></textarea>
                <div class="field-hint"><span id="bio-count">0</span>/500</div>
            </div>
            <button type="button" class="btn btn-primary" id="save-bio-button">Save description</button>
        </div>

        <div id="profile-readonly" class="hidden">
            <h3>Description</h3>
            <p id="profile-bio-text" class="profile-bio-text"></p>
        </div>

        <p id="profile-status" class="status hidden" role="status"></p>
    </section>
</main>

<script type="module" src="/js/profile.js"></script>
</body>
</html>
